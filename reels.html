<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reels – JaidevEdit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="assets/css/style.css">
<style>
/* Reels-specific UI */
.reels-container{
  height:calc(100vh - 60px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.reel{
  height:100vh;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617;
}
.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.reel .overlay{
  position:absolute;
  bottom:80px;
  left:15px;
  right:15px;
  color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.reel .title{
  font-weight:bold;
  margin-bottom:6px;
}
</style>
</head>
<body>

<header class="top">
  <h2>Reels</h2>
</header>

<div class="reels-container" id="reelsBox"></div>

<script src="assets/js/reels.js"></script>
<script src="assets/js/navbar.js"></script>
</body>
</html>
