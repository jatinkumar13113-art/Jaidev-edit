<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jaidev Edit – Templates</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>Jaidev Edit</h1>
  <p>CapCut • VN • Gemini Prompts</p>
</header>

<nav class="tabs">
  <button onclick="loadCategory('capcut')">CapCut</button>
  <button onclick="loadCategory('vn')">VN</button>
  <button onclick="loadCategory('gemini')">Gemini</button>
</nav>

<main id="list">Select a category</main>

<script src="data.js"></script>
<script>
  function loadCategory(cat){
    const list = document.getElementById('list');
    list.innerHTML = '';
    const items = DATA.filter(x => x.category === cat);

    if(items.length === 0){
      list.innerHTML = '<p>No posts yet</p>';
      return;
    }

    items.forEach(d => {
      list.innerHTML += `
        <div class="card">
          <span class="badge">${d.category.toUpperCase()}</span>
          <img src="${d.thumbnail}" alt="${d.title}">
          <h3>${d.title}</h3>
          <pre>${d.prompt}</pre>
          <div class="actions">
            <a href="${d.telegram}" target="_blank" class="tg">Download (Telegram)</a>
            <a href="${d.drive}" target="_blank" class="drive">Backup (Drive)</a>
          </div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
