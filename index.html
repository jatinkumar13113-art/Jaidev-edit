<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JaidevEdit</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <h1>#JaidevEdit</h1>
  <button id="darkToggle">🌙</button>
</header>

<input type="text" id="search" placeholder="Search prompts, VN codes, templates..." />

<div class="category">
  <a href="categories/trending-prompts.html">🔥 Trending Prompts</a>
  <a href="categories/vn-codes.html">🎬 Trending VN Codes</a>
  <a href="categories/capcut-templates.html">✂️ CapCut Templates</a>
</div>

<h2>Latest Added</h2>

<div class="movie-grid">

  <div class="movie-card">
    <img src="https://via.placeholder.com/300x420" alt="thumbnail">
    <p class="prompt-text">Ultra cinematic reel prompt with dramatic lighting</p>
    <button class="copy-btn" onclick="copyText(this)">Copy</button>
  </div>

  <div class="movie-card">
    <img src="https://via.placeholder.com/300x420" alt="thumbnail">
    <p class="prompt-text">VN slow motion cinematic preset code</p>
    <button class="copy-btn" onclick="copyText(this)">Copy</button>
  </div>

</div>

<!-- Telegram Floating Button -->
<a href="https://t.me/YourTelegramUsername" class="telegram-btn" target="_blank">
  Join Telegram
</a>

<!-- Telegram Auto Popup -->
<div id="tgPopup" class="tg-popup">
  <div class="tg-box">
    <h3>🔥 Join Our Telegram</h3>
    <p>Daily Prompts • VN Codes • CapCut Templates</p>
    <a href="https://t.me/YourTelegramUsername" class="tg-join" target="_blank">
      Join Now
    </a>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
