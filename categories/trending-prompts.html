<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Prompts - JaidevEdit</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  <h1>🔥 Trending Prompts</h1>
  <button id="darkToggle">🌙</button>
</header>

<input type="text" id="search" placeholder="Search prompts...">

<div class="movie-grid">

  <div class="movie-card">
    <img src="../assets/thumbnails/reel1.jpg" alt="thumbnail">
    <p class="prompt-text">Ultra cinematic reel prompt with dramatic lighting and shallow depth</p>
    <button class="copy-btn" onclick="copyText(this)">Copy</button>
  </div>

  <div class="movie-card">
    <img src="../assets/thumbnails/reel2.jpg" alt="thumbnail">
    <p class="prompt-text">8K movie look prompt, ARRI Alexa style, soft color grading</p>
    <button class="copy-btn" onclick="copyText(this)">Copy</button>
  </div>

</div>

<a href=" https://t.me/Jaidevjks" class="telegram-btn" target="_blank">Join Telegram</a>

<div id="tgPopup" class="tg-popup">
  <div class="tg-box">
    <h3>🔥 Join Our Telegram</h3>
    <p>Daily Trending Prompts</p>
    <a href=" https://t.me/Jaidevjks " class="tg-join" target="_blank">Join Now</a>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script src="../script.js"></script>
</body>
</html>
