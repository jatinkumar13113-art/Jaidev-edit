<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – JaidevEdit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top">
  <div class="admin-name">JaidevEdit Admin</div>
  <button class="logout" onclick="adminLogout()">Logout</button>
</div>

<!-- TABS -->
<div class="tabs">
  <button onclick="openTab('capcut')">CapCut</button>
  <button onclick="openTab('vn')">VN</button>
  <button onclick="openTab('gemini')">Gemini</button>
  <button onclick="openTab('video')">Video</button>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- CAPCUT -->
  <div class="tab-content" id="capcut">
    <h3>CapCut Upload</h3>
    <input placeholder="Title">
    <input type="file">
    <input placeholder="CapCut Link">
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- VN -->
  <div class="tab-content" id="vn">
    <h3>VN Upload</h3>
    <input placeholder="Title">
    <input type="file">
    <input placeholder="VN QR Code">
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- GEMINI -->
  <div class="tab-content" id="gemini">
    <h3>Gemini Prompt</h3>
    <input placeholder="Title">
    <input type="file">
    <textarea placeholder="Prompt"></textarea>
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- VIDEO -->
  <div class="tab-content" id="video">
    <h3>Video Upload</h3>
    <input placeholder="Title">
    <input type="file">
    <input type="file">
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- STATUS -->
  <div id="uploadStatus"></div>

</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>

    <button onclick="addVN()">Upload</button>
  </div>

  <div class="tab-content" id="gemini">
    <input id="gTitle" placeholder="Title">
    <input type="file" id="gThumb">
    <textarea id="gPrompt" placeholder="Prompt"></textarea>
    <label><input type="checkbox" id="gTrend"> Trending</label>
    <button onclick="addGemini()">Upload</button>
  </div>

  <div class="tab-content" id="video">
    <input id="vTitle" placeholder="Title">
    <input type="file" id="vThumb">
    <input type="file" id="vFile">
    <label><input type="checkbox" id="vTrend"> Trending</label>
    <button onclick="addVideo()">Upload</button>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
