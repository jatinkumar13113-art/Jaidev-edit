<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – JaidevEdit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0b1020;
  color:#fff;
  font-family:Arial;
  padding:15px;
}
input, textarea, select, button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}
button{
  background:#22c55e;
  color:#000;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>🔥 JaidevEdit Admin</h2>

<label>Content Type</label>
<select id="type">
  <option value="capcut">CapCut</option>
  <option value="vn">VN</option>
  <option value="gemini">Gemini</option>
  <option value="video">Video</option>
</select>

<input id="title" placeholder="Title">

<input id="thumb" placeholder="Thumbnail Image URL">

<input id="link" placeholder="CapCut / Video Link (optional)">

<input id="qr" placeholder="VN QR Code (optional)">

<textarea id="prompt" placeholder="Gemini Prompt (optional)"></textarea>

<label>
  <input type="checkbox" id="trending"> Mark as Trending
</label>

<button onclick="uploadData()">UPLOAD</button>

<p id="status"></p>

<!-- Firebase -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/dashboard.js"></script>

</body>
</html>  </div>

  <!-- VN -->
  <div class="tab-content" id="vn">
    <h3>VN Upload</h3>
    <input placeholder="Title">
    <input type="file">
    <input placeholder="VN QR Code">
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- GEMINI -->
  <div class="tab-content" id="gemini">
    <h3>Gemini Prompt</h3>
    <input placeholder="Title">
    <input type="file">
    <textarea placeholder="Prompt"></textarea>
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- VIDEO -->
  <div class="tab-content" id="video">
    <h3>Video Upload</h3>
    <input placeholder="Title">
    <input type="file">
    <input type="file">
    <label><input type="checkbox"> Trending</label>
    <button class="uploadBtn">Upload</button>
  </div>

  <!-- STATUS -->
  <div id="uploadStatus"></div>

</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>    <label><input type="checkbox" id="vnTrend"> Trending</label>

  <div class="tab-content" id="gemini">
    <input id="gTitle" placeholder="Title">
    <input type="file" id="gThumb">
    <textarea id="gPrompt" placeholder="Prompt"></textarea>
    <label><input type="checkbox" id="gTrend"> Trending</label>
    <button onclick="addGemini()">Upload</button>
  </div>

  <div class="tab-content" id="video">
    <input id="vTitle" placeholder="Title">
    <input type="file" id="vThumb">
    <input type="file" id="vFile">
    <label><input type="checkbox" id="vTrend"> Trending</label>
    <button onclick="addVideo()">Upload</button>
  </div>

</div>

<script src="js/dashboard.js"></script>

</html>
